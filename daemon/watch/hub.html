<!doctype html>
<!--
  gamepilot hub: the live runs on this machine, each linking to its own watch
  page, which the hub serves under runs/NAME/ (served by `gamepilot_daemon
  --hub`, daemon/src/watch_hub.cpp; design in docs/design/Watch-Page.md).
  External sources (entries with a `source`: a view-only daemon showing
  another program's window) are listed under Watching, with their picture's
  state (live, stale, covered) from their /summary.json; the live runs table
  and `live` are our own runs only.
  GET runs.json lists the registry's live entries; each run's mode, trial and
  state come from that run's /summary.json, through the hub too. A running
  checkpoint series (series.json) is one row, linking to its page
  (series/ID/), with its current checkpoint, how far it is and what its run
  going does; its runs are not listed again. recent.json
  lists the latest finished runs (RESULTS.tsv). Links are relative, so a LAN
  viewer's links stay on the LAN address.

  All runs: history.json lists every run folder (run.json, else the folder's
  name and its RESULTS.tsv row), newest first, each linking to its page
  (runs/NAME/: the live page while it runs, its record after). The filters
  live in the URL's query (game, program, backend, mode, result, since,
  until, q), so a filtered list can be bookmarked: ?backend=switch&result=fail.
  A click on a column's header sorts by it, a second click reverses; the sort
  is in the query too (sort=start&dir=desc, the default: newest first), and
  group=program puts each program's runs under its own heading. The game and
  program filters offer the values the runs' run.json carry (the program
  registry's ids, shown by their names): the daemon knows no game, and a
  program with no run has nothing to filter.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GamePilot Runs</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1c2026; --muted: #69707a;
    --line: #dfe3e8; --ok: #1f8a4c; --bad: #c62f2f; --cur: #1f6fd1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14171b; --panel: #1c2026; --text: #e6e9ed; --muted: #9aa3ad;
      --line: #2d333b; --ok: #4cc27f; --bad: #ff6b6b; --cur: #6aa8ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header h1 { font-size: 16px; margin: 0; }
  #conn { color: var(--muted); font-size: 13px; }
  #conn.down { color: var(--bad); font-weight: 600; }
  #live { margin-left: auto; }
  section + h2 { margin-top: 16px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em;
       color: var(--muted); margin: 0 0 6px; }
  main { padding: 12px 16px; }
  section {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; overflow-x: auto;
  }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  td, th { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--line);
           white-space: nowrap; }
  tr:last-child td { border-bottom: 0; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase;
       letter-spacing: 0.05em; }
  td.num { font-variant-numeric: tabular-nums; }
  td.state { white-space: normal; }
  a { color: var(--cur); font-weight: 600; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .muted { color: var(--muted); font-size: 12px; }
  .failed { color: var(--bad); }
  .passed { color: var(--ok); }
  .empty { color: var(--muted); font-style: italic; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; align-items: end; }
  .filters label { display: flex; flex-direction: column; font-size: 12px; color: var(--muted); gap: 2px; }
  .filters select, .filters input {
    font: inherit; font-size: 13px; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; min-height: 30px;
  }
  .filters input[type=search] { min-width: 180px; }
  .filters button { font: inherit; font-size: 13px; background: var(--panel); color: var(--text);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; min-height: 30px; cursor: pointer; }
  #count { color: var(--muted); font-size: 12px; margin-left: auto; align-self: center; }
  .range b { color: var(--text); }
  .range { color: var(--muted); }
  td .why { white-space: normal; max-width: 26em; }
  td.reason { white-space: normal; max-width: 28em; color: var(--muted); font-size: 12px; }
  .running { color: var(--cur); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th[aria-sort=ascending]::after { content: " ▲"; }
  th[aria-sort=descending]::after { content: " ▼"; }
  th[aria-sort=ascending], th[aria-sort=descending] { color: var(--text); }
  tr.group td { font-weight: 600; padding-top: 12px; }
  tr.group .muted { font-weight: 400; margin-left: 8px; }
  .filters label.toggle { flex-direction: row; align-items: center; gap: 6px; min-height: 30px; }
  .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px;
         padding: 0 4px; margin-left: 4px; font-weight: 400; }
  @media (max-width: 700px) {
    .filters label { flex: 1 1 40%; }
    .filters input[type=search] { min-width: 0; }
    td.reason { max-width: 16em; }
  }
</style>
</head>
<body>
<header>
  <h1>GamePilot runs</h1>
  <span id="conn">loading…</span>
  <a id="live" href="live" title="Bookmark this: it always opens the newest live run">newest live run</a>
</header>
<main>
  <section id="watching-panel" hidden>
    <h2>Watching</h2>
    <table>
      <thead><tr><th>Name</th><th>Source</th><th>Elapsed</th><th>Picture</th></tr></thead>
      <tbody id="watching"></tbody>
    </table>
  </section>
  <section>
    <table>
      <thead><tr><th>Run</th><th>Checkpoint</th><th>Mode</th><th>Trial</th>
        <th>Elapsed</th><th>State</th></tr></thead>
      <tbody id="runs"><tr><td class="empty" colspan="6">loading the live runs</td></tr></tbody>
    </table>
  </section>
  <h2>All runs</h2>
  <form class="filters" id="filters" onsubmit="return false">
    <label>Game<select name="game"></select></label>
    <label>Program<select name="program"></select></label>
    <label>Backend<select name="backend"></select></label>
    <label>Mode<select name="mode"></select></label>
    <label>Result<select name="result"></select></label>
    <label>Since<input type="date" name="since"></label>
    <label>Until<input type="date" name="until"></label>
    <label>Search<input type="search" name="q" placeholder="run name or failure reason"></label>
    <label class="toggle"><input type="checkbox" name="group" value="program">Group by program</label>
    <button type="button" id="clear">Clear</button>
    <span id="count"></span>
  </form>
  <section>
    <table>
      <thead><tr id="columns"><th data-sort="run">Run</th><th data-sort="game">Game</th>
        <th data-sort="program">Program</th><th data-sort="checkpoint">Checkpoints</th>
        <th data-sort="backend">Backend</th><th data-sort="mode">Mode</th>
        <th data-sort="result">Result</th><th data-sort="start">Started</th>
        <th data-sort="duration">Duration</th></tr></thead>
      <tbody id="history"><tr><td class="empty" colspan="9">loading</td></tr></tbody>
    </table>
  </section>
</main>
<script>
"use strict";
const POLL_MS = 2000;
const $ = (id) => document.getElementById(id);
const summaries = new Map();   // run name -> the run's latest /summary.json

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}

// "4:05" or "1:02:09".
function duration(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  const two = (n) => String(n).padStart(2, "0");
  const h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return (h ? h + ":" + two(m) : String(m)) + ":" + two(s % 60);
}

// A run's page, through this hub.
const runUrl = (name) => "runs/" + encodeURIComponent(name) + "/";
const seriesUrl = (id) => "series/" + encodeURIComponent(id) + "/";

async function fetchSummary(name) {
  try {
    const reply = await fetch(runUrl(name) + "summary.json", {cache: "no-store"});
    if (reply.ok) summaries.set(name, await reply.json());
  } catch (e) {
    summaries.delete(name);
  }
}

// What the run is doing: the plan's current (or failed) event, else the chain.
function stateOf(summary) {
  const plan = summary && summary.plan;
  const run = summary && summary.run;
  if (plan) {
    const i = plan.events.findIndex((e) => e.state === "current" || e.state === "failed");
    if (i >= 0) {
      const e = plan.events[i];
      // The current event's time so far (v1.8 plans carry its start).
      const time = e.state === "current" && e.started_ms != null ?
        " · " + duration(Date.now() - e.started_ms) : "";
      return [(e.state === "failed" ? "failed at " : "") + "#" + (i + 1) + " " + e.id + time,
              e.state === "failed" ? "failed" : ""];
    }
  }
  if (run) {
    const failed = run.checkpoints.find((c) => c.state === "failed");
    if (failed) return ["stopped at " + failed.id, "failed"];
    if (!run.checkpoints.some((c) => c.state === "current")) return ["chain done", "passed"];
  }
  return ["starting", ""];
}

// External sources: each links to its page; the picture's state and why.
function renderWatching(sources) {
  $("watching-panel").hidden = !sources.length;
  $("watching").replaceChildren(...sources.map((r) => {
    const source = (summaries.get(r.run) || {}).source;
    const tr = el("tr");
    const name = el("td");
    const link = el("a", "", r.run);
    link.href = runUrl(r.run);
    name.append(link, el("div", "muted", "port " + r.port));
    const state = source ? source.state + (source.detail ? " · " + source.detail : "") : "starting";
    tr.append(name, el("td", "", r.source), el("td", "num", duration(Date.now() - r.started_ms)),
              el("td", "state " + (source && source.state !== "live" ? "failed" : ""), state));
    return tr;
  }));
}

// A running series: one row for all its runs.
function seriesRow(s) {
  const cps = s.checkpoints;
  const cur = cps.findIndex((c) => c.state === "current");
  const current = cur >= 0 ? cps[cur] : null;
  const last = current && current.runs.length ? current.runs[current.runs.length - 1] : null;
  const tr = el("tr");
  const name = el("td");
  const link = el("a", "", (s.program_name || s.program || "series") + " " + s.from + " → " + s.to);
  link.href = seriesUrl(s.series);
  name.append(link, el("div", "muted", s.backend + " · series · " + cps.filter((c) => c.state === "passed").length +
                       " of " + cps.length + " passed"));
  const [state, cls] = s.run ? stateOf(summaries.get(s.run)) : ["between runs", ""];
  tr.append(name, el("td", "", current ? current.id + " (" + (cur + 1) + " of " + cps.length + ")" : "–"),
            el("td", "", s.mode),
            el("td", "num", last ? "run " + last.n + (last.attempt > 1 ? " attempt " + last.attempt : "") : "–"),
            el("td", "num", duration(Date.now() - s.started_ms)),
            el("td", "state " + cls, state));
  return tr;
}

function render(all, series) {
  renderWatching(all.filter((r) => r.source));
  const entries = all.filter((r) => !r.source && !r.series);
  const body = $("runs");
  body.replaceChildren(...[...series].reverse().map(seriesRow));
  if (!entries.length && !series.length) {
    const td = el("td", "empty", "no live runs: gamepilot run --watch starts one");
    td.colSpan = 6;
    const tr = el("tr");
    tr.append(td);
    body.append(tr);
    return;
  }
  for (const r of entries) {
    const summary = summaries.get(r.run);
    const run = summary && summary.run;
    const current = run && run.checkpoints.find((c) => c.state === "current");
    const tr = el("tr");
    const name = el("td");
    const link = el("a", "", r.run || r.checkpoint || "run " + r.pid);
    link.href = runUrl(r.run);
    name.append(link, el("div", "muted", r.backend + " · port " + r.port));
    const checkpoint = current ? current.id : (r.checkpoint || "–");
    const started = run ? run.started_ms : r.started_ms;
    const [state, cls] = stateOf(summary);
    tr.append(name, el("td", "", checkpoint), el("td", "", run ? run.mode : "–"),
              el("td", "num", run && run.trial ? run.trial + " of " + run.trials +
                 " · " + run.passes + " passed" : "–"),
              el("td", "num", started ? duration(Date.now() - started) : "–"),
              el("td", "state " + cls, state));
    body.append(tr);
  }
}

// --- All runs ------------------------------------------------------------------

const FILTERS = ["game", "program", "backend", "mode", "result", "since", "until", "q"];
const CHOICES = ["game", "program", "backend", "mode", "result"];
const UNKNOWN = "(unknown)";
const BACKEND_NAMES = {mgba: "mGBA", switch: "Switch", view: "View"};
// What a choice filter shows for a run's value: the registry's name.
const NAME_OF = {game: "game_name", program: "program_name"};
let allRuns = [];

// The sort: a column's key and its direction; newest first by default.
const SORT_DEFAULT = {key: "start", dir: "desc"};
let sort = {...SORT_DEFAULT};

// Each column's value to sort by; "" and 0 are unknown and always go last.
const runEnd = (r) => r.live ? Date.now() : r.ended_ms;
const SORT_KEYS = {
  run: (r) => r.run,
  game: (r) => r.game_name || r.game,
  program: (r) => r.program_name || r.program,
  checkpoint: (r) => r.checkpoint,
  backend: (r) => BACKEND_NAMES[r.backend] || r.backend,
  mode: (r) => r.mode || r.kind,
  result: (r) => r.result,
  start: (r) => r.started_ms,
  duration: (r) => r.started_ms && runEnd(r) ? runEnd(r) - r.started_ms : 0,
};
// Numbers start newest or longest first; text starts A to Z.
const FIRST_DIR = {start: "desc", duration: "desc"};

function compareRuns(a, b) {
  const key = SORT_KEYS[sort.key];
  const x = key(a), y = key(b);
  const known = (v) => v !== "" && v !== 0 && v != null;
  if (known(x) !== known(y)) return known(x) ? -1 : 1;
  let c = typeof x === "number" ? x - y : String(x).localeCompare(String(y), undefined, {numeric: true});
  if (sort.dir === "desc") c = -c;
  return c || (b.started_ms || 0) - (a.started_ms || 0) || (a.run < b.run ? 1 : -1);
}

function showSort() {
  for (const th of $("columns").children) {
    th.classList.add("sortable");
    if (th.dataset.sort === sort.key) th.setAttribute("aria-sort", sort.dir === "asc" ? "ascending" : "descending");
    else th.removeAttribute("aria-sort");
  }
}

function filterValues() {
  const form = $("filters");
  const values = {};
  for (const name of FILTERS) values[name] = form.elements[name].value;
  return values;
}
const grouped = () => $("filters").elements.group.checked;

// The filters from the URL (?backend=switch&result=fail), once at load.
function readQuery() {
  const query = new URLSearchParams(location.search);
  const form = $("filters");
  if (SORT_KEYS[query.get("sort")]) sort.key = query.get("sort");
  if (["asc", "desc"].includes(query.get("dir"))) sort.dir = query.get("dir");
  else if (query.get("sort")) sort.dir = FIRST_DIR[sort.key] || "asc";
  form.elements.group.checked = query.get("group") === "program";
  for (const name of FILTERS) {
    const v = query.get(name);
    if (v === null) continue;
    if (form.elements[name].tagName === "SELECT") {
      const select = form.elements[name];
      if (![...select.options].some((o) => o.value === v)) select.append(new Option(v, v));
    }
    form.elements[name].value = v;
  }
}

function writeQuery() {
  const query = new URLSearchParams();
  for (const [k, v] of Object.entries(filterValues())) if (v) query.set(k, v);
  query.set("sort", sort.key);
  query.set("dir", sort.dir);
  if (grouped()) query.set("group", "program");
  const text = query.toString();
  replaceUrl(location.pathname + (text ? "?" + text : ""));
}
function replaceUrl(url) {
  try { window.history.replaceState(null, "", url); } catch (e) {}
}

// Each choice filter offers the values the runs have, keeping the chosen one.
function fillChoices() {
  const form = $("filters");
  for (const name of CHOICES) {
    const select = form.elements[name];
    const chosen = select.value;
    const values = new Set(allRuns.map((r) => r[name] || UNKNOWN));
    if (chosen) values.add(chosen);
    const names = new Map();
    if (NAME_OF[name]) for (const r of allRuns) if (r[NAME_OF[name]]) names.set(r[name], r[NAME_OF[name]]);
    const label = (v) => name === "backend" ? (BACKEND_NAMES[v] || v) : (names.get(v) || v);
    select.replaceChildren(new Option("all", ""),
      ...[...values].sort((a, b) => label(a).localeCompare(label(b)))
        .map((v) => new Option(label(v), v)));
    select.value = chosen;
  }
}

// Local midnight of a yyyy-mm-dd input.
function dayStart(text) {
  const [y, m, d] = text.split("-").map(Number);
  return new Date(y, m - 1, d).getTime();
}

function matches(row, f) {
  for (const name of CHOICES) {
    if (f[name] && (row[name] || UNKNOWN) !== f[name]) return false;
  }
  const t = row.started_ms || row.ended_ms;
  if (f.since && (!t || t < dayStart(f.since))) return false;
  if (f.until && (!t || t >= dayStart(f.until) + 86400000)) return false;
  if (f.q) {
    const q = f.q.toLowerCase();
    const text = (row.run + " " + row.reason + " " + row.at).toLowerCase();
    if (!text.includes(q)) return false;
  }
  return true;
}

// "Nov 23 21:31", or "21:31" today.
function when(ms) {
  if (!ms) return "–";
  const d = new Date(ms);
  const hm = d.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", hour12: false});
  return d.toDateString() === new Date().toDateString() ? "today " + hm :
    d.toLocaleDateString([], {month: "short", day: "numeric"}) + " " + hm;
}

// from → to, the run's own checkpoint in bold.
function rangeCell(row) {
  const td = el("td", "range");
  const part = (id) => id === row.checkpoint ? el("b", "", id) : document.createTextNode(id || "–");
  if (!row.from || row.from === row.to) {
    td.append(part(row.checkpoint || row.from));
  } else {
    td.append(part(row.from), " → ", part(row.to));
    if (row.checkpoint !== row.from && row.checkpoint !== row.to) {
      td.append(" (", el("b", "", row.checkpoint), ")");
    }
  }
  return td;
}

function resultCell(row) {
  if (row.result === "running") return el("td", "running", "running");
  if (row.result === "pass") return el("td", "passed", "passed");
  if (row.result === "fail") {
    const td = el("td", "failed", "failed" + (row.at ? " at " + row.at : ""));
    if (row.reason) td.title = row.reason;
    return td;
  }
  return el("td", "muted", row.result || "–");
}

// A program's heading row: its name, group and run count.
function groupRow(row, count) {
  const td = el("td", "", row.program_name || row.program || UNKNOWN);
  td.colSpan = 9;
  td.append(el("span", "muted", [row.group, row.program, count + " run" + (count === 1 ? "" : "s")]
    .filter(Boolean).join(" · ")));
  const tr = el("tr", "group");
  tr.append(td);
  return tr;
}

// Grouped: by program name (unknown last), the sort inside each group.
function sortedRows(rows) {
  rows.sort(compareRuns);
  if (!grouped()) return rows;
  const name = (r) => r.program_name || r.program || "";
  return rows.map((r, i) => [r, i]).sort(([a, i], [b, j]) =>
    (!name(a) - !name(b)) || name(a).localeCompare(name(b)) || i - j).map(([r]) => r);
}

function renderHistory() {
  const body = $("history");
  const f = filterValues();
  const rows = sortedRows(allRuns.filter((r) => matches(r, f)));
  body.replaceChildren();
  showSort();
  let group = null;
  for (const row of rows) {
    const programId = row.program || "";
    if (grouped() && programId !== group) {
      group = programId;
      body.append(groupRow(row, rows.filter((r) => (r.program || "") === programId).length));
    }
    const tr = el("tr");
    const name = el("td");
    const link = el("a", "", row.run);
    link.href = runUrl(row.run);
    name.append(link);
    if (row.recorded) name.append(el("span", "tag", "frames"));
    if (row.result === "fail" && row.reason) name.append(el("div", "muted why", row.reason.slice(0, 90)));
    const end = row.live ? Date.now() : row.ended_ms;
    const game = el("td", "", row.game_name || row.game || "–");
    if (row.game_name) game.title = row.game;
    const program = el("td", "", row.program_name || row.program || "–");
    if (row.program_name) program.title = row.program + (row.group ? " · " + row.group : "");
    tr.append(name, game, program,
              rangeCell(row), el("td", "", BACKEND_NAMES[row.backend] || row.backend || "–"),
              el("td", "", row.mode || row.kind || "–"), resultCell(row),
              el("td", "num", when(row.started_ms)),
              el("td", "num", row.started_ms && end ? duration(end - row.started_ms) : "–"));
    body.append(tr);
  }
  if (!rows.length) {
    const td = el("td", "empty", allRuns.length ? "no run matches the filters" : "no runs yet");
    td.colSpan = 9;
    const tr = el("tr");
    tr.append(td);
    body.append(tr);
  }
  $("count").textContent = rows.length + " of " + allRuns.length + " runs";
}

async function pollHistory() {
  if (!document.hidden) {
    try {
      const reply = await fetch("history.json", {cache: "no-store"});
      allRuns = await reply.json();
      fillChoices();
      renderHistory();
    } catch (e) {}
  }
  setTimeout(pollHistory, HISTORY_POLL_MS);
}
const HISTORY_POLL_MS = 5000;

$("filters").addEventListener("input", () => { writeQuery(); renderHistory(); });
$("clear").addEventListener("click", () => {
  for (const name of FILTERS) $("filters").elements[name].value = "";
  writeQuery();
  renderHistory();
});
$("columns").addEventListener("click", (event) => {
  const th = event.target.closest("th");
  if (!th || !th.dataset.sort) return;
  sort = th.dataset.sort === sort.key ?
    {key: sort.key, dir: sort.dir === "asc" ? "desc" : "asc"} :
    {key: th.dataset.sort, dir: FIRST_DIR[th.dataset.sort] || "asc"};
  writeQuery();
  renderHistory();
});
readQuery();
showSort();

let entries = [];
let series = [];
async function poll() {
  try {
    const reply = await fetch("runs.json", {cache: "no-store"});
    entries = await reply.json();
    series = await fetch("series.json", {cache: "no-store"})
      .then((r) => r.ok ? r.json() : []).catch(() => []);
    await Promise.all(entries.map((r) => fetchSummary(r.run)));
    const runs = entries.filter((r) => !r.source && !r.series).length + series.length;
    const watched = entries.length - runs;
    $("conn").textContent = runs + " live run" + (runs === 1 ? "" : "s") +
      (watched ? " · " + watched + " watched" : "");
    $("conn").className = "";
  } catch (e) {
    $("conn").textContent = "hub unreachable, retrying…";
    $("conn").className = "down";
  }
  render(entries, series);
  setTimeout(poll, POLL_MS);
}
poll();
pollHistory();
</script>
</body>
</html>
