# Settings for dev/lint/ (sh dev/lint/lint_ocaml.sh). Paths are relative to the repo root.
root src
root dev/lint
test_dir test
library_dir lib
exceptions dev/lint/ocaml_lint_exceptions.conf
# Errors are values: no raising or catching outside tests (AGENTS.md).
no_exceptions src

max_function_lines 50
max_function_avg_depth 3.0
max_function_depth 5
max_file_avg_depth 2.5
max_file_lines 300
max_interface_lines 300
complexity_advisory 10

# Layers, most specific first. A program may use its own game; a game never another game. The
# registry lists every game's programs, so it may use any game. The engine is the game-agnostic
# checkpoint engine; pokemon is code shared by Pokemon games, which only the games of its family
# (and their programs) may use (docs/design/Engine-Boundary.md). Pokémon games may sit under
# src/games/pokemon/<game>; one there in no family (plza) still links the engine alone
# (docs/roadmap/plza-autostory-port.md).
layer base src/base/**
layer core src/core/**
layer engine src/engine/**
layer pokemon src/pokemon/**
layer registry src/program_registry/**
layer program src/games/pokemon/{game}/programs/{program}/**
layer game src/games/pokemon/{game}/**
layer program src/games/{game}/programs/{program}/**
layer game src/games/{game}/**
layer bin src/bin/**
allow base base
allow core core base
allow engine engine core base
allow pokemon pokemon engine core base
allow game game pokemon engine core base
allow program program game pokemon engine core base
allow registry registry game pokemon engine core base
allow bin *
family pokemon game frlg

# A game's rules are kept apart from its formats (docs/design/Engine-Boundary.md): the rules, the
# plan's types, the runner, its failures and the checks link no JSON (the plan codec and the saved
# libraries hold it) and no text library (the text libraries print the rules at the edge), directly
# or through another library.
never_links src/engine/checkpoints/rules/lib yojson json_field wire engine_plan_codec engine_text engine_saved
never_links src/engine/checkpoints/postcondition/lib yojson json_field wire engine_plan_codec engine_text engine_saved
never_links src/engine/checkpoints/plan/lib yojson json_field wire engine_plan_codec engine_text engine_saved
never_links src/engine/checkpoints/run/lib yojson json_field wire engine_plan_codec engine_text engine_saved
never_links src/pokemon/checkpoints/rules/lib yojson json_field wire engine_plan_codec engine_text engine_saved pokemon_plan_codec pokemon_text pokemon_saved
never_links src/games/pokemon/plza/checkpoints/terms/lib yojson json_field wire engine_plan_codec engine_text engine_saved plza_plan_codec plza_text plza_saved
