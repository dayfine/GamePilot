# Settings for lint/ (sh tools/lint_ocaml.sh). Paths are relative to the repo root.
root src
root lint
test_dir test
library_dir lib
exceptions tools/ocaml_lint_exceptions.conf

max_function_lines 50
max_function_avg_depth 3.0
max_function_depth 5
max_file_avg_depth 2.5
max_file_lines 300
max_interface_lines 300
complexity_advisory 10

# Layers, most specific first. A program may use its own game; a game never another game. The
# registry lists every game's programs, so it may use any game.
layer base src/base/**
layer core src/core/**
layer pokemon src/pokemon/**
layer registry src/program_registry/**
layer program src/games/{game}/programs/{program}/**
layer game src/games/{game}/**
layer bin src/bin/**
allow base base
allow core core base
allow pokemon pokemon core base
allow game game pokemon core base
allow program program game pokemon core base
allow registry registry game pokemon core base
allow bin *
