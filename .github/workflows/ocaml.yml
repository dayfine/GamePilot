# harness: project
name: OCaml
on:
  push:
    branches: [main]
    paths-ignore:
      - "daemon/**"
      - ".github/workflows/daemon.yml"
  pull_request:
    # The daemon's C++ has its own workflow; the OCaml build reads none of it.
    # protocol/ is not ignored: the OCaml tests parse its golden files.
    paths-ignore:
      - "daemon/**"
      - ".github/workflows/daemon.yml"
# A newer push to a PR replaces its queued or running run, as daemon.yml does;
# main's runs all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are the slow queue: a PR stacked on another branch
        # runs Ubuntu and Windows only, since it is pushed again (and runs on
        # all three) once its base merges and it is based on main.
        os: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    # setup-ocaml saves and restores dune's cache folder, but dune 3.25 wrote
    # nothing to it without this.
    env:
      DUNE_CACHE: enabled
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the PokemonSimulation submodule (maps read by tests)
        shell: bash
        run: git submodule update --init --depth 1 third_party/PokemonSimulation
      - name: Lint dune files and opam dependencies
        shell: bash
        run: sh dev/lint/lint_dune.sh
      - name: Test the mGBA runner's lock
        if: runner.os != 'Windows'
        run: sh run/test_run_lock.sh
      - name: Test the dune test failure report (dev/ci/)
        if: runner.os == 'Linux'
        run: sh dev/ci/test_report_test_failures.sh
      - name: Check golden JSON formatting
        if: runner.os == 'Linux'
        run: python3 dev/lint/fmt_json.py --check protocol/v1/*.json
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          # opam root/switch cache (on by default in v3) and dune's build cache.
          cache: true
          dune-cache: true
      - working-directory: src
        run: opam install . --deps-only --yes
      - working-directory: src
        run: opam exec -- dune build
      - working-directory: src
        shell: bash
        run: |
          set +e
          opam exec -- dune test 2>&1 | tee dune-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then sh ../dev/ci/report_test_failures.sh dune-test.log; fi
          exit "$status"
      - name: Run Hub JS UI tests (Node, dev-only)
        if: runner.os == 'Linux'
        run: node --test src/hub/test/test_hub_ui.mjs
      - name: Check the user guides (docs/guide/) against the registry and the plans
        if: runner.os == 'Linux'
        working-directory: src
        run: opam exec -- dune exec -- gamepilot guide --check
      - name: Build and test the OCaml linters (dev/lint/)
        if: runner.os == 'Linux'
        working-directory: dev/lint
        shell: bash
        run: |
          opam exec -- dune build
          set +e
          opam exec -- dune test 2>&1 | tee dune-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then sh ../ci/report_test_failures.sh dune-test.log; fi
          exit "$status"
      - name: Run the OCaml linters on src/ and dev/lint/
        if: runner.os == 'Linux'
        run: opam exec -- sh dev/lint/lint_ocaml.sh
      - name: Check formatting (ocamlformat version from src/.ocamlformat)
        if: runner.os == 'Linux'
        working-directory: src
        run: |
          opam install --yes "ocamlformat=$(sed -n 's/^version *= *//p' .ocamlformat)"
          opam exec -- dune build @fmt
          cd ../dev/lint && opam exec -- dune build @fmt
