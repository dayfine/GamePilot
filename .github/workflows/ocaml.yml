# harness: project
name: OCaml
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # setup-ocaml saves and restores dune's cache folder, but dune 3.25 wrote
    # nothing to it without this.
    env:
      DUNE_CACHE: enabled
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the PokemonSimulation submodule (maps read by tests)
        shell: bash
        run: git submodule update --init --depth 1 third_party/PokemonSimulation
      - name: Lint dune files and opam dependencies
        shell: bash
        run: sh dev/lint/lint_dune.sh
      - name: Test the mGBA runner's lock
        if: runner.os != 'Windows'
        run: sh run/test_run_lock.sh
      - name: Test the dune test failure report (dev/ci/)
        if: runner.os == 'Linux'
        run: sh dev/ci/test_report_test_failures.sh
      - name: Check golden JSON formatting
        if: runner.os == 'Linux'
        run: python3 dev/lint/fmt_json.py --check protocol/v1/*.json
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
          # opam root/switch cache (on by default in v3) and dune's build cache.
          cache: true
          dune-cache: true
      - working-directory: src
        run: opam install . --deps-only --yes
      - working-directory: src
        run: opam exec -- dune build
      - working-directory: src
        shell: bash
        run: |
          set +e
          opam exec -- dune test 2>&1 | tee dune-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then sh ../dev/ci/report_test_failures.sh dune-test.log; fi
          exit "$status"
      - name: Build and test the OCaml linters (dev/lint/)
        if: runner.os == 'Linux'
        working-directory: dev/lint
        shell: bash
        run: |
          opam exec -- dune build
          set +e
          opam exec -- dune test 2>&1 | tee dune-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then sh ../ci/report_test_failures.sh dune-test.log; fi
          exit "$status"
      - name: Run the OCaml linters on src/ and dev/lint/
        if: runner.os == 'Linux'
        run: opam exec -- sh dev/lint/lint_ocaml.sh
      - name: Check formatting (ocamlformat version from src/.ocamlformat)
        if: runner.os == 'Linux'
        working-directory: src
        run: |
          opam install --yes "ocamlformat=$(sed -n 's/^version *= *//p' .ocamlformat)"
          opam exec -- dune build @fmt
          cd ../dev/lint && opam exec -- dune build @fmt
