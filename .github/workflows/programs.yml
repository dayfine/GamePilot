# harness: project
name: Programs
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Lint dune files and opam dependencies
        shell: bash
        run: sh tools/lint_dune.sh
      - uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"
      - working-directory: programs
        run: opam install . --deps-only --yes
      - working-directory: programs
        run: opam exec -- dune build
      - working-directory: programs
        run: opam exec -- dune test
