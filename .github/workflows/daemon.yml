# harness: project
name: Daemon
on:
  push:
    branches: [main]
    paths:
      - "daemon/**"
      - "protocol/**"
      - "third_party/Arduino-Source"
      - ".github/workflows/daemon.yml"
  pull_request:
    paths:
      - "daemon/**"
      - "protocol/**"
      - "third_party/Arduino-Source"
      - ".github/workflows/daemon.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are the slow queue: a PR stacked on another branch
        # runs Ubuntu and Windows only, since it is pushed again (and runs on
        # all three) once its base merges and it is based on main.
        os: ${{ fromJSON((github.event_name != 'pull_request' || github.base_ref == 'main') && '["ubuntu-latest", "macos-latest", "windows-latest"]' || '["ubuntu-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Only the Arduino-Source submodule; Packages is not needed to build CoreLib.
      - name: Check out Arduino-Source
        shell: bash
        run: git submodule update --init --depth 1 third_party/Arduino-Source

      - name: Install OpenCV (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev ninja-build
      - name: Install OpenCV (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv ninja
      - name: Install OpenCV (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install opencv --no-progress -y
          echo "OpenCV_DIR=C:/tools/opencv/build" >> "$GITHUB_ENV"
          echo "C:\\tools\\opencv\\build\\x64\\vc16\\bin" >> "$GITHUB_PATH"

      # Compiler cache: ccache on Linux/macOS, sccache with MSVC on Windows. The key
      # holds the Arduino-Source pin, so an unchanged pin restores a warm cache.
      - name: Cache key
        id: cache-key
        shell: bash
        run: |
          case "$RUNNER_OS" in
            Linux) compiler=gcc ;;
            macOS) compiler=appleclang ;;
            Windows) compiler=msvc ;;
          esac
          sha=$(git rev-parse HEAD:third_party/Arduino-Source)
          echo "key=daemon-${RUNNER_OS}-${RUNNER_ARCH}-${compiler}-${sha}" >> "$GITHUB_OUTPUT"
      - uses: hendrikmuhs/ccache-action@v1.2.26
        with:
          key: ${{ steps.cache-key.outputs.key }}
          variant: ${{ runner.os == 'Windows' && 'sccache' || 'ccache' }}
          max-size: 1G
      # MSVC through Ninja: the Visual Studio generator ignores compiler launchers.
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S daemon -B daemon/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl \
              -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          else
            cmake -S daemon -B daemon/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build
        run: cmake --build daemon/build --config Release --parallel 4
      - name: Compiler cache stats
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then sccache --show-stats; else ccache --show-stats; fi
      - name: Test
        run: ctest --test-dir daemon/build -C Release --output-on-failure
      - name: Diagnose probe_images (temporary)
        if: always() && runner.os == 'Windows'
        shell: bash
        working-directory: daemon/tests/probe_images
        run: |
          cmake --version
          tool=$(cygpath -m "$GITHUB_WORKSPACE/daemon/build/probe_images.exe")
          bad=0
          for i in $(seq 300); do
            "$tool" --spec probes.json --game-size 24x16 frame.png > out.txt 2> err.txt; s=$?
            n=$(wc -c < out.txt)
            if [ $s -ne 0 ] || [ "$n" -lt 100 ]; then bad=$((bad+1)); echo "run $i: status=$s out_len=$n err=$(cat err.txt)"; fi
          done
          echo "bash redirect: $bad/300 bad"
          cmake -DTOOL="$tool" -P ../probe_images_diag.cmake
          ctest --test-dir "$GITHUB_WORKSPACE/daemon/build" -C Release -R probe_images_test --repeat until-fail:100 --output-on-failure | tail -30
