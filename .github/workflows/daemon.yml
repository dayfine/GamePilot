# harness: project
name: Daemon
on:
  push:
    branches: [main]
    paths:
      - "daemon/**"
      - "third_party/Arduino-Source"
      - ".github/workflows/daemon.yml"
  pull_request:
    paths:
      - "daemon/**"
      - "third_party/Arduino-Source"
      - ".github/workflows/daemon.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Only the Arduino-Source submodule; Packages is not needed to build CoreLib.
      - name: Check out Arduino-Source
        shell: bash
        run: git submodule update --init --depth 1 third_party/Arduino-Source

      - name: Install OpenCV (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libopencv-dev ninja-build
      - name: Install OpenCV (macOS)
        if: runner.os == 'macOS'
        run: brew install opencv ninja
      - name: Install OpenCV (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          choco install opencv --no-progress -y
          echo "OpenCV_DIR=C:/tools/opencv/build" >> "$GITHUB_ENV"
          echo "C:\\tools\\opencv\\build\\x64\\vc16\\bin" >> "$GITHUB_PATH"

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S daemon -B daemon/build
          else
            cmake -S daemon -B daemon/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build
        run: cmake --build daemon/build --config Release --parallel 4
      - name: Run
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            daemon/build/Release/gamepilot_daemon.exe
          else
            daemon/build/gamepilot_daemon
          fi
