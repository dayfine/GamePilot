# harness: project
# When a PR closes (merged or not), cancel its branch's queued and running
# workflow runs: no newer push will ever come to replace them, so the
# concurrency groups in ocaml.yml and daemon.yml never cancel them.
name: Cancel closed PR runs
on:
  pull_request:
    types: [closed]
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel the branch's unfinished runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref }}
          SELF: ${{ github.run_id }}
        run: |
          for status in queued in_progress waiting pending; do
            gh run list --repo "$REPO" --branch "$BRANCH" --status "$status" \
              --json databaseId --jq '.[].databaseId'
          done | sort -u | while read -r id; do
            [ "$id" = "$SELF" ] && continue
            echo "cancel $id"
            gh run cancel "$id" --repo "$REPO" || true
          done
