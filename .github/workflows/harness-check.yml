# harness: reusable
name: Harness Check

on:
  pull_request:
    paths:
      - '.agents/**'
      - '.agents/checks/agent-harness-check.sh'
      - '.agents/checks/agent-standing-rules-check.sh'
      - '.agents/checks/test-agent-standing-rules-check.sh'
      - 'dev/lib/chain-runner.sh'
      - 'dev/lib/wait-pr-checks.sh'
      - '.agents/checks/test-chain-runner.sh'
      - '.agents/checks/test-wait-pr-checks.sh'
      - '.agents/checks/agent-harness-sync.sh'
      - '.agents/checks/test-agent-harness-sync.sh'
      - 'dev/lib/session-brief.sh'
      - '.agents/checks/test-session-brief.sh'

jobs:
  check-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run agent-harness-check.sh
        run: sh .agents/checks/agent-harness-check.sh
      - name: Run agent-standing-rules-check.sh
        run: sh .agents/checks/agent-standing-rules-check.sh
      - name: Test agent-standing-rules-check.sh
        if: hashFiles('.agents/checks/test-agent-standing-rules-check.sh') != ''
        run: sh .agents/checks/test-agent-standing-rules-check.sh
      - name: Test chain-runner.sh
        if: hashFiles('.agents/checks/test-chain-runner.sh') != ''
        run: sh .agents/checks/test-chain-runner.sh
      - name: Test wait-pr-checks.sh
        if: hashFiles('.agents/checks/test-wait-pr-checks.sh') != ''
        run: sh .agents/checks/test-wait-pr-checks.sh
      - name: Test agent-harness-sync.sh
        if: hashFiles('.agents/checks/test-agent-harness-sync.sh') != ''
        run: sh .agents/checks/test-agent-harness-sync.sh
      - name: Test session-brief.sh
        if: hashFiles('.agents/checks/test-session-brief.sh') != ''
        run: sh .agents/checks/test-session-brief.sh
